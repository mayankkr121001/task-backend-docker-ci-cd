name: Backend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-backend:${{ github.sha }}

      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/task-manager-backend:${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE
          script: |
            set -e

            sudo docker pull "$IMAGE"

            sudo docker stop task-manager-backend-container || true
            sudo docker rm task-manager-backend-container || true

            sudo docker run -d \
              --name task-manager-backend-container \
              --restart unless-stopped \
              --env-file /home/ubuntu/task-manager-backend/.env
              -p 5000:5000 \
              "$IMAGE"

            sudo docker ps